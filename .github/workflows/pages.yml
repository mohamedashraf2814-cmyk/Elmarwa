# نشر واجهة مستشفى المروة تلقائياً على GitHub Pages عند كل دفع إلى الفرع main
name: نشر على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من صحة ملفات JavaScript
        run: for f in $(find assets/js -name '*.js'); do node --check "$f"; done

      - name: تجهيز الملفات للنشر
        run: |
          mkdir -p _site
          cp -r index.html assets docs _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
